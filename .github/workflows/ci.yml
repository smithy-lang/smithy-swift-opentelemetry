name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # This matrix runs tests on iOS sim & Mac, on oldest & newest supported Xcodes
        runner:
          - macos-14
          - xcode-27
        xcode:
          - Xcode_16.1
          - Xcode_27.0
        destination:
          - 'platform=iOS Simulator,OS=18.1,name=iPhone 16'
          - 'platform=iOS Simulator,OS=27.0,name=iPhone 17'
          - 'platform=tvOS Simulator,OS=18.1,name=Apple TV 4K (3rd generation) (at 1080p)'
          - 'platform=tvOS Simulator,OS=27.0,name=Apple TV 4K (3rd generation) (at 1080p)'
          - 'platform=visionOS Simulator,OS=2.1,name=Apple Vision Pro'
          - 'platform=visionOS Simulator,OS=27.0,name=Apple Vision Pro'
          - 'platform=macOS'
        exclude:
          # Don't run old macOS with new Xcode
          - runner: macos-14
            xcode: Xcode_27.0
          # Don't run new macOS with old Xcode
          - runner: xcode-27
            xcode: Xcode_16.1
          # Don't run old simulators with new Xcode
          - destination: 'platform=tvOS Simulator,OS=18.1,name=Apple TV 4K (3rd generation) (at 1080p)'
            xcode: Xcode_27.0
          - destination: 'platform=iOS Simulator,OS=18.1,name=iPhone 16'
            xcode: Xcode_27.0
          - destination: 'platform=visionOS Simulator,OS=2.1,name=Apple Vision Pro'
            xcode: Xcode_27.0
          # Don't run new simulators with old Xcode
          - destination: 'platform=tvOS Simulator,OS=27.0,name=Apple TV 4K (3rd generation) (at 1080p)'
            xcode: Xcode_16.1
          - destination: 'platform=iOS Simulator,OS=27.0,name=iPhone 17'
            xcode: Xcode_16.1
          - destination: 'platform=visionOS Simulator,OS=27.0,name=Apple Vision Pro'
            xcode: Xcode_16.1
    steps:
      - name: Configure Xcode
        run: sudo xcode-select -s /Applications/${{ matrix.xcode }}.app

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Cache Swift
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
          key: 1-${{ runner.os }}-${{ matrix.xcode }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            1-${{ runner.os }}-${{ matrix.xcode }}-${{ hashFiles('Package.swift') }}
            1-${{ runner.os }}-${{ matrix.xcode }}-

      - name: Tools Versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build and Run Tests
        run: |
          set -o pipefail && \
          NSUnbufferedIO=YES xcodebuild \
            -scheme smithy-swift-opentelemetry \
            -destination '${{ matrix.destination }}' \
            test 2>&1 \
            | xcbeautify

  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        swift:
          - 5.10-jammy
          - 6.3-noble
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Cache Swift
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/org.swift.swiftpm
          key: 1-${{ runner.os }}-swift-${{ matrix.swift }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            1-${{ runner.os }}-swift-${{ matrix.swift }}-spm-${{ hashFiles('Package.swift') }}
            1-${{ runner.os }}-swift-${{ matrix.swift }}-spm-

      - name: Tools Versions
        run: swift --version

      - name: Build and Run Tests
        run: swift test
